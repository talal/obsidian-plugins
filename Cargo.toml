[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "0BSD"

[workspace.dependencies]
console_error_panic_hook = "0.1"
formatter-core = { path = "crates/formatter-core" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 'z' # Optimize for size
lto = true # Enable Link Time Optimization (LTO)
codegen-units = 1 # Reduce parallel code generation units to increase optimization
panic = 'abort' # Abort on panic
strip = true # Strip symbols from binary

# formatter-cli ships with unwind panics so formatter-core's catch_unwind can
# report a panicking file as an error instead of aborting the whole batch.
[profile.cli]
inherits = "release"
panic = "unwind"
